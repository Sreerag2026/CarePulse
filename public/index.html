<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="CarePulse — remote patient monitoring for parents and doctors.">
<meta name="theme-color" content="#0F7A6C">
<title>CarePulse</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // Apply the saved theme before the page draws, so dark mode doesn't flash white.
  (function(){
    var preference = 'system';
    try { preference = localStorage.getItem('carepulse-theme') || 'system'; } catch (e) {}
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var dark = preference === 'dark' || (preference === 'system' && prefersDark);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<link rel="stylesheet" href="styles.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></symbol>

  </svg>

  <!-- Public navigation (home, sign-in, registration, settings when signed out) -->
  <header class="site-nav" hidden>
    <div class="container nav-inner">
      <a class="brand" href="#/"><img src="icon.png" alt="" width="30" height="30">CarePulse</a>
      <div class="nav-spacer"></div>
      <a class="icon-btn" href="#/settings" aria-label="Settings" title="Settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></a>
      <a class="btn btn-ghost btn-sm" href="#/login">Log in</a>
      <a class="btn btn-primary btn-sm" href="#/register">Get started</a>
    </div>
  </header>

  <!-- App header (parent and doctor portals) -->
  <header class="app-header" hidden>
    <div class="container nav-inner">
      <a class="brand" id="app-home-link" href="#/"><img src="icon.png" alt="" width="30" height="30">CarePulse</a>
      <div class="nav-spacer"></div>
      <a class="icon-btn" href="#/settings" aria-label="Settings" title="Settings"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></a>
      <button type="button" class="btn btn-secondary btn-sm" onclick="logout()">
        <svg class="icon" aria-hidden="true"><use href="#i-log-out"/></svg>
        Log out
      </button>
    </div>
  </header>

  <main id="app">
    <section class="page" data-page="home" hidden>
      <div class="container app-main"><h1>CarePulse</h1></div>
    </section>

    <section class="page" data-page="login" hidden>
      <div class="container app-main"><h1>Sign in</h1></div>
    </section>

    <section class="page" data-page="register" hidden>
      <div class="container app-main"><h1>Create an account</h1></div>
    </section>

    <section class="page" data-page="reset" hidden>
      <div class="container app-main"><h1>Reset your password</h1></div>
    </section>

    <section class="page" data-page="dashboard" hidden>
      <div class="container app-main"><h1>Dashboard</h1></div>
    </section>

    <section class="page" data-page="patients" hidden>
      <div class="container app-main"><h1>Patients</h1></div>
    </section>

    <section class="page" data-page="patient" hidden>
      <div class="container app-main"><h1>Patient</h1></div>
    </section>

    <section class="page" data-page="settings" hidden>
      <div class="container app-main"><h1>Settings</h1></div>
    </section>
  </main>

  <footer class="site-footer" hidden>
    <div class="container">
      <p class="text-caption">© 2026 CarePulse</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script defer src="core.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
